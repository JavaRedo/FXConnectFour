spring.application.name=fxconnectfour-backend

spring.datasource.url=jdbc:mysql://localhost:3306/fxconnectfour?createDatabaseIfNotExist=true
spring.datasource.username=root
#add password as arg
#mvn spring-boot:run "-Dspring-boot.run.arguments=--password=db_password"
spring.datasource.password=${password:placeholder}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect